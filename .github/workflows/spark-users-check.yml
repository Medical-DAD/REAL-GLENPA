name: Spark User Management Checks
on:
  push:
    branches: [main]
    paths:
      - 'portal.js'
      - 'excel-lite.js'
      - 'portal.css'
      - 'tests/patient-directory-excel.test.mjs'
      - 'firestore.rules'
      - 'tests/clinical-history.test.cjs'
      - 'tests/excel-upload.test.mjs'
      - 'excel-lite.js'
      - 'vendor/**'
      - 'index.html'
      - 'admin-tools/**'
      - 'tests/spark-users.test.cjs'
      - '.github/workflows/spark-users-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check portal.js
          node --check excel-lite.js
          node --check admin-tools/manage.cjs
      - name: Set up XML parser for Excel compatibility tests (CI only)
        run: npm install --no-save --ignore-scripts @xmldom/xmldom@0.9.8
      - name: Validate Spark user-management invariants
        run: node --test tests/spark-users.test.cjs tests/clinical-history.test.cjs tests/excel-upload.test.mjs tests/patient-directory-excel.test.mjs
