function graphLine(values,labels,unit){let n=values.length;if(!n)return '';const min=Math.max(0,Math.floor(Math.min(...values)-.5)),max=Math.ceil(Math.max(...values)+.5),lo=min===max?min-1:min,hi=min===max?max+1:max,points=values.map((v,i)=>[52+i* (430/Math.max(1,n-1)),24+(hi-v)/(hi-lo)*135]);return `<svg class="trend-plot" role="img" aria-label="${t('HbA1c trend over recorded visits','اتجاه الهيموغلوبين السكري عبر الزيارات المسجلة')}" viewBox="0 0 520 225"><line x1="46" y1="25" x2="46" y2="168" stroke="var(--line)"/><line x1="46" y1="168" x2="490" y2="168" stroke="var(--line)"/>${[0,1,2,3].map(i=>`<line x1="46" y1="${24+i*45}" x2="490" y2="${24+i*45}" stroke="var(--line)" stroke-dasharray="3 5"/>`).join('')}<polyline fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${points.map(p=>p.join(',')).join(' ')}"/>${points.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="6" fill="var(--primary)"/><text x="${x}" y="${y-13}" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">${values[i].toFixed(1)}${unit}</text><text x="${x}" y="197" text-anchor="middle" font-size="13" fill="var(--sub)">${labels[i]}</text>`).join('')}</svg>`}
function outcomeChart(){let pts=[0,1,2].map(i=>patients.filter(p=>p.visits[i]));let av=pts.map((group,i)=>group.reduce((a,p)=>a+Number(p.visits[i].hba1c),0)/Math.max(group.length,1));return `<div class="card"><h3>${t('Mean HbA1c by visit','متوسط الهيموغلوبين السكري حسب الزيارة')}</h3>${graphLine(av,[t('Baseline','خط الأساس'),t('Month 3','الشهر ٣'),t('Month 6','الشهر ٦')],'%')}<p class="muted small">${t('Descriptive cross-sectional visit means; patient composition differs at each time point. Not a paired comparison.','متوسطات وصفية لكل زيارة وقد تختلف مجموعة المرضى بين الزيارات، وليست مقارنة مزدوجة للأفراد.')}</p></div>`}
function changeSummary(ps){let pairs=ps.filter(p=>p.visits.length>=3&&Number.isFinite(Number(p.visits[0].hba1c))&&Number.isFinite(Number(p.visits[2].hba1c)));let d=pairs.length?pairs.reduce((sum,p)=>sum+(+p.visits[2].hba1c- +p.visits[0].hba1c),0)/pairs.length:null;return {n:pairs.length,change:d}}
function clinicBars(){return `<div class="card"><div class="row"><h3>${t('Doctor comparison · Month 6 completion','مقارنة العيادات · إكمال زيارة الشهر السادس')}</h3>${b(t('All clinics →','كل العيادات ←'),'nav:clinics')}</div><div class="compare-bars">${Array.from({length:N},(_,i)=>i+1).map(c=>{let m=metric(c);return `<button class="compare-row" data-action="clinic:${c}" title="${clinicLabel(c)}"><span>${clinicLabel(c)}</span><span class="track"><span class="fill" style="width:${m.total?m.v3/m.total*100:0}%"></span></span><b>${m.v3}/${m.total}</b></button>`}).join('')}</div><p class="muted small">${t('Select a clinic bar to open its patient register.','اختر أي شريط لفتح سجل مرضى العيادة.')}</p></div>`}
function admin(){let main='',m=metric(),where=state.patient?t('Patient record','ملف المريض'):state.view==='clinicDetail'?clinicLabel(state.selectedClinic):({overview:t('Executive overview','نظرة تنفيذية'),clinics:t('Clinic performance','أداء العيادات'),patients:t('Patient directory','دليل المرضى'),quality:t('Safety & quality','السلامة وجودة البيانات')}[state.view]||t('Overview','نظرة عامة'));if(state.patient){main=profile(pById(state.patient));}else if(state.view==='clinics'){main=clinics();}else if(state.view==='patients'){main=directory();}else if(state.view==='clinicDetail'){main=clinicDetail(state.selectedClinic)}else if(state.view==='quality'){main=quality()}else{main=overview(m)}return `<div class="premium-shell"><aside class="premium-rail noprint"><div class="rail-heading"><span class="rail-logo">✦</span><div><b>GLENPA REAL</b><small>STUDY COMMAND CENTER</small></div></div><div class="rail-label">${t('WORKSPACE','مساحة العمل')}</div>${[['overview','◫',t('Overview','نظرة عامة')],['clinics','▦',t('Clinics','العيادات')],['patients','♧',t('Patient directory','دليل المرضى')],['quality','◇',t('Safety & quality','السلامة والجودة')]].map(([k,ico,v])=>`<button class="rail-link ${state.view===k&&!state.patient?'active':''}" data-action="nav:${k}"><span class="rail-icon">${ico}</span>${v}<span class="rail-arrow">›</span></button>`).join('')}<div class="rail-divider"></div><div class="rail-label">${t('STUDY DATA','بيانات الدراسة')}</div><button class="rail-link" data-action="exportCSV"><span class="rail-icon">⇩</span>${t('Export visit data','تصدير بيانات الزيارات')}</button><div class="rail-footer"><span class="live-dot"></span><div><strong>${t('Demonstration environment','بيئة تجريبية')}</strong><small>${t('Synthetic patients only','مرضى افتراضيون فقط')}</small></div></div></aside><section class="premium-main"><div class="executive-top"><div><div class="eyebrow">${t('DAR ALDAWA / MEDICAL AFFAIRS','دار الدواء / الشؤون الطبية')}</div><h1>${where}</h1><p>${t('GLENPA REAL · Prospective observational study · 6-month follow-up','جلينبا REAL · دراسة رصدية مستقبلية · متابعة لمدة ٦ أشهر')}</p></div><div class="top-actions"><span class="status-tag"><i></i>${t('DEMO DATA','بيانات تجريبية')}</span>${b(t('Find patient','البحث عن مريض'),'nav:patients','search-cta')}</div></div><div class="breadcrumb noprint"><span>${t('Study command center','مركز إدارة الدراسة')}</span><span>›</span><strong>${where}</strong>${state.patient?`<span>›</span><strong>${esc(names(pById(state.patient)||{name:'',arName:''}))}</strong>`:''}</div><div class="content-area">${main}</div><footer class="portal-footer">GLENPA REAL 3.0 · ${t('Illustrative synthetic records · Not for collection of real health data','سجلات اصطناعية توضيحية · لا يجوز جمع معلومات صحية فعلية')}</footer></div></section></div>`}
function overview(m){let cs=changeSummary(patients), followed=patients.filter(p=>p.visits.length===3).length;let cards=[[t('Patients enrolled','المرضى المسجلون'),m.total,t('Across 26 doctors','لدى ٢٦ طبيباً')],[t('Month 3 assessments','تقييمات الشهر الثالث'),m.v2,((m.v2/Math.max(m.total,1))*100).toFixed(0)+'%'],[t('Month 6 assessments','تقييمات الشهر السادس'),m.v3,((m.v3/Math.max(m.total,1))*100).toFixed(0)+'%'],[t('Paired HbA1c change','التغير المزدوج في HbA1c'),cs.change===null?'—':cs.change.toFixed(2)+' pp',t('n = ','عدد المرضى = ')+cs.n]];let clinicMetrics=Array.from({length:N},(_,i)=>{let c=i+1,z=metric(c);return {c,z,ratio:z.v3/Math.max(z.total,1)}}).sort((a,b)=>b.ratio-a.ratio||a.c-b.c);let rings=[[m.v1,t('Baseline','خط الأساس'),'#237fc0'],[m.v2,t('Month 3','الشهر الثالث'),'#12acac'],[m.v3,t('Month 6','الشهر السادس'),'#42bfa1']];let ringSvg=(n,lab,color)=>{let pct=Math.round(100*n/Math.max(m.total,1)),r=42,circ=2*Math.PI*r;return `<div class="studio-ring"><svg viewBox="0 0 120 120" role="img" aria-label="${lab} ${pct}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" fill="var(--text)" font-weight="800" font-size="23">${pct}%</text></svg><b>${n}/${m.total}</b><span>${lab}</span></div>`};return `<section class="studio-hero"><div class="studio-eyebrow">${t('CLINICAL INTELLIGENCE · EXECUTIVE VIEW','الذكاء السريري · العرض التنفيذي')}</div><h2>${t('The complete patient journey, beautifully understood.','رحلة المريض كاملة، بوضوح بصري استثنائي.')}</h2><p>${t('Explore enrollment, longitudinal glycaemic measurements, visit completion and clinic performance in one interactive research command center.','استكشف التسجيل وقياسات السكر على مدى الزمن واكتمال الزيارات وأداء العيادات في لوحة بحثية تفاعلية واحدة.')}</p><span class="pill">${t('FICTIONAL DATA · DEMONSTRATION','بيانات افتراضية · عرض تجريبي')}</span></section><div class="studio-stats">${cards.map(x=>`<div class="studio-stat"><small>${x[0]}</small><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('')}</div><div class="studio-layout"><div><section class="studio-panel"><div class="studio-title">${t('GLYCAEMIC JOURNEY','المسار السكري')}</div><h3>${t('HbA1c over time','الهيموغلوبين السكري على مدى الزمن')}</h3>${outcomeChart()}<div class="studio-legend"><span><i></i>${t('Mean by available visit','المتوسط حسب الزيارات المتاحة')}</span><span>${t('Cross-sectional means, not paired observations','متوسطات مقطعية وليست مشاهدات مزدوجة')}</span></div></section><section class="studio-panel"><div class="studio-title">${t('SITE INTELLIGENCE','تحليلات المواقع')}</div><h3>${t('Clinic completion leaderboard','ترتيب اكتمال المتابعة حسب العيادة')}</h3><div class="studio-tiles">${clinicMetrics.slice(0,9).map(({c,z,ratio})=>`<button class="studio-tile" data-action="clinic:${c}"><small>${clinicLabel(c)}</small><strong>${Math.round(ratio*100)}%</strong><div class="studio-track"><span class="studio-fill" style="width:${ratio*100}%"></span></div><small>${z.v3}/${z.total} ${t('Month 6','الشهر السادس')} ↗</small></button>`).join('')}</div><div class="studio-disclaimer">${t('Tap a clinic to examine every patient and visit. Completion reflects recorded visits, not treatment effectiveness.','اختر عيادة لاستعراض جميع المرضى والزيارات. الاكتمال يعني توثيق الزيارة وليس فعالية العلاج.')}</div></section></div><div><section class="studio-panel"><div class="studio-title">${t('STUDY RETENTION','استمرار المتابعة')}</div><h3>${t('The three-visit pathway','مسار الزيارات الثلاث')}</h3><div class="studio-rings">${rings.map(([n,lab,color])=>ringSvg(n,lab,color)).join('')}</div><div class="studio-disclaimer">${t('Each stage shows the proportion of enrolled patients with that visit recorded.','تعكس كل مرحلة نسبة المرضى المسجلين الذين وُثقت زيارتهم.')}</div></section><section class="studio-panel"><div class="studio-title">${t('CLINICAL SIGNALS','المؤشرات السريرية')}</div><h3>${t('Follow-up portrait','صورة المتابعة')}</h3><div class="studio-progress"><b>${t('Month 3','الشهر ٣')}</b><div class="studio-track"><span class="studio-fill" style="width:${m.v2/Math.max(m.total,1)*100}%"></span></div><small>${m.v2}/${m.total}</small></div><div class="studio-progress"><b>${t('Month 6','الشهر ٦')}</b><div class="studio-track"><span class="studio-fill" style="width:${m.v3/Math.max(m.total,1)*100}%"></span></div><small>${m.v3}/${m.total}</small></div><div class="studio-progress"><b>${t('Full visits','الزيارات كاملة')}</b><div class="studio-track"><span class="studio-fill" style="width:${followed/Math.max(m.total,1)*100}%"></span></div><small>${followed}/${m.total}</small></div><div class="studio-disclaimer">${t('Visit completion is an operational measure, not treatment effectiveness.','اكتمال الزيارات مؤشر تشغيلي ولا يقيس الفعالية العلاجية.')}</div></section><section class="studio-panel"><div class="studio-title">${t('SAFETY SNAPSHOT','ملخص السلامة')}</div><h3>${t('Reported adverse events','الأحداث الضارة المبلّغ عنها')}</h3><div style="font-size:48px;font-weight:850;line-height:1.15;color:var(--primary)">${m.ae}</div><p class="studio-mini">${t('Event reports rather than unique patient count.','عدد بلاغات الأحداث وليس عدد المرضى الفريدين.')}</p><button data-action="nav:quality" class="primary">${t('Explore safety review →','استعراض مراجعة السلامة ←')}</button></section></div></div><div class="studio-disclaimer">${t('All analytics are based on fictional illustrative records. HbA1c change is measured in percentage points. Observational results alone cannot establish causality.','جميع التحليلات مستمدة من سجلات افتراضية لأغراض العرض. يُقاس تغير HbA1c بالنقاط المئوية، ولا تثبت النتائج الرصدية وحدها السببية.')}</div>`}
function clinicTable(limit){return `<div class="scroll"><table><thead><tr><th>${t('Doctor / Clinic','الطبيب / العيادة')}</th><th>${t('Specialty and area','الاختصاص والمنطقة')}</th><th>${t('Patients','المرضى')}</th><th>${t('Visit 1','الزيارة ١')}</th><th>${t('Visit 2','الزيارة ٢')}</th><th>${t('Visit 3','الزيارة ٣')}</th><th>${t('Open','فتح')}</th></tr></thead><tbody>${Array.from({length:limit?6:N},(_,i)=>i+1).sort((a,b)=>state.sortClinics==='completion'?metric(b).v3-metric(a).v3:a-b).map(c=>{let m=metric(c);return `<tr class="click" data-action="clinic:${c}"><td><strong>${clinicLabel(c)}</strong><div class="tiny">${t('Clinic','عيادة')} ${pad(c)}</div></td><td>${clinicMeta(c)}</td><td>${m.total}</td><td>${m.v1}</td><td>${m.v2}</td><td>${m.v3}</td><td><span class="link">${t('Open patients →','عرض المرضى ←')}</span></td></tr>`}).join('')}</tbody></table></div>`}
function clinics(){return `<div class="card"><div class="row"><h2>${t('All participating clinics','جميع العيادات المشاركة')}</h2>${dropdown('sortClinics',[['number',t('Sort: clinic number','ترتيب: رقم العيادة')],['completion',t('Sort: Month 6 completion','ترتيب: إنجاز الشهر السادس')]],state.sortClinics)}</div><p class="muted">${t('Select any doctor to view enrolled study patients and visits.','اختر الطبيب لعرض المرضى المسجلين وزياراتهم.')}</p>${clinicTable(false)}</div>`}
function patientTable(ps){return `<div class="scroll"><table><thead><tr><th>${t('Patient name','اسم المريض')}</th><th>${t('Study patient ID','الرقم التعريفي للمريض في الدراسة')}</th><th>${t('Clinic','العيادة')}</th><th>${t('Age / Sex','العمر / الجنس')}</th><th>${t('Visits','الزيارات')}</th><th>${t('Latest HbA1c','آخر HbA1c')}</th><th>${t('Action','الإجراء')}</th></tr></thead><tbody>${ps.map(p=>`<tr class="click" data-action="patient:${esc(p.id)}"><td><strong>${esc(names(p))}</strong></td><td>${esc(p.id)}</td><td>${clinicLabel(p.clinic)}</td><td>${p.age} / ${t(p.gender,p.gender==='Male'?'ذكر':'أنثى')}</td><td><span class="pill">${p.visits.length}/3</span></td><td>${fmt(p.visits.at(-1)?.hba1c)}%</td><td><span class="link">${t('View profile →','عرض الملف ←')}</span></td></tr>`).join('')}</tbody></table>${!ps.length?`<div class="empty">${t('No matching patients','لا يوجد مرضى مطابقون')}</div>`:''}</div>`}
function directory(){let list=patients.filter(p=>(p.name+' '+p.arName+' '+p.id).toLowerCase().includes(state.search.toLowerCase())&&(state.visitFilter==='all'||p.visits.length===Number(state.visitFilter)));return `<div class="card"><h2>${t('All patients','جميع المرضى')} <span class="pill">${list.length}</span></h2><div class="toolbar noprint"><input id="search" value="${esc(state.search)}" placeholder="${t('Patient name or study ID','اسم المريض أو رقم تعريفه بالدراسة')}">${dropdown('visitFilter',[['all',t('All visits','جميع الزيارات')],['1',t('1 recorded visit','زيارة واحدة مسجلة')],['2',t('2 recorded visits','زيارتان مسجلتان')],['3',t('3 recorded visits','ثلاث زيارات مسجلة')]],state.visitFilter)}<button data-action="search">${t('Apply filters','تطبيق عوامل التصفية')}</button><button data-action="clearSearch">${t('Clear','مسح')}</button></div>${patientTable(list)}</div>`}
function clinicDetail(c){let m=metric(c),ps=patients.filter(p=>p.clinic===c),matching=ps.filter(p=>(p.name+' '+p.arName+' '+p.id).toLowerCase().includes(state.clinicSearch.toLowerCase()));return `<div class="back noprint">${b(t('← All clinics','← العيادات'),'nav:clinics')}</div><div class="card"><h2>${clinicLabel(c)} — ${t('Clinic Report','تقرير العيادة')}</h2><p class="muted">${clinicMeta(c)}</p><p class="muted">${t('Patient register starts at zero. Enrolled study records appear here.','يبدأ سجل المرضى من الصفر، وتظهر هنا سجلات الدراسة المضافة.')}</p></div>${boxStats(m)}<div class="card"><h3>${t('Clinic patient register','سجل مرضى العيادة')}</h3><div class="toolbar noprint"><input id="clinicSearch" value="${esc(state.clinicSearch)}" placeholder="${t('Search name / ID','ابحث بالاسم أو الرقم')}"><button data-action="clinicSearch">${t('Search','بحث')}</button></div>${patientTable(matching)}</div>`}
function visits(p){return `<div class="timeline">${p.visits.map((v,i)=>`<section class="event"><div class="row"><h3 style="margin:0">${mon(i)} · ${t('Visit','زيارة')} ${v.number}</h3><span class="pill">${fmt(v.date)}</span></div><div class="kv"><div><span class="muted">HbA1c</span><b>${fmt(v.hba1c)}%</b></div><div><span class="muted">${t('Fasting plasma glucose (FPG)','غلوكوز البلازما الصيامي')}</span><b>${fmt(v.fpg)} mg/dL</b></div><div><span class="muted">eGFR</span><b>${fmt(v.egfr)} mL/min/1.73m²</b></div><div><span class="muted">${t('Weight','الوزن')}</span><b>${fmt(v.weight)} kg</b></div><div><span class="muted">${t('Glenpa tablet strength','تركيز قرص جلينبا')}</span><b>${fmt(v.dose)}</b></div></div><p><strong>${t('Concomitant medication changes:','التغييرات في الأدوية المصاحبة:')}</strong> ${esc(clinicalTerm(v.change))}</p><p><strong>${t('Newly diagnosed comorbidities:','أمراض مصاحبة شُخّصت حديثاً:')}</strong> ${esc(clinicalTerm(v.diagnosis))}</p><p><strong>${t('Adverse events (AEs):','الأحداث الضارة (AEs):')}</strong> ${esc(clinicalTerm(v.ae))}</p><p><strong>${t('Visit notes:','ملاحظات الزيارة:')}</strong> ${esc(clinicalTerm(v.notes))}</p></section>`).join('')}${p.visits.length<3?`<div class="event" style="border-style:dashed"><strong>${mon(p.visits.length)} — ${t('Pending','قيد الانتظار')}</strong><p class="muted">${t('Not yet recorded in this demo.','لم تسجل بعد.')}</p></div>`:''}</div>`}
function profile(p){if(!p)return'<div class="card">Patient not found</div>';let first=p.visits[0],last=p.visits.at(-1);return `<div class="back noprint">${b(t('← '+clinicLabel(p.clinic),'← '+clinicLabel(p.clinic)),'clinic:'+p.clinic)} ${b(t('Print profile','طباعة الملف'),'print')}</div><div class="card"><div class="row"><div><h2 style="margin:0">${esc(names(p))}</h2><div class="muted">${esc(p.id)} · ${clinicLabel(p.clinic)}</div></div><span class="pill">${p.visits.length}/3 ${t('visits completed','زيارات مكتملة')}</span></div><h3>${t('Patient profile — baseline history','ملف المريض — التاريخ الأساسي')}</h3><div class="kv"><div><span class="muted">${t('Age','العمر')}</span><b>${p.age}</b></div><div><span class="muted">${t('Sex (male/female)','الجنس (ذكر/أنثى)')}</span><b>${t(p.gender,p.gender==='Male'?'ذكر':'أنثى')}</b></div><div><span class="muted">${t('Diabetes duration','مدة السكري')}</span><b>${p.diabetesYears} ${t('years','سنوات')}</b></div></div><p><strong>${t('Medical history:','التاريخ المرضي:')}</strong> ${fmt(p.history)}</p><p><strong>${t('Comorbidities:','الأمراض المصاحبة:')}</strong> ${esc(p.diagnoses.length?p.diagnoses.map(clinicalTerm).join('، '):t('None recorded','لا توجد أمراض مسجلة'))}</p><h4>${t('Baseline concomitant medications','الأدوية المصاحبة الأساسية')}</h4><div class="scroll"><table><thead><tr><th>${t('Medicine','الدواء')}</th><th>${t('Dose','الجرعة')}</th><th>${t('Frequency','التكرار')}</th><th>${t('Status','الحالة')}</th></tr></thead><tbody>${medsFormatted(p)}</tbody></table></div></div><div class="card"><h3>${t('HbA1c trend','اتجاه الهيموغلوبين السكري (HbA1c)')}</h3>${graphLine(p.visits.map(v=>+v.hba1c),p.visits.map((v,i)=>mon(i)),'%')}<p class="muted small">${t('The line shows observed HbA1c (%) at each recorded visit.','يوضح الخط قيم الهيموغلوبين السكري (%) في كل زيارة مسجلة.')}</p></div><div class="card"><h2>${t('Chronological visit timeline','التسلسل الزمني للزيارات')}</h2><p class="muted">${t('Each visit retains its own laboratory results, medication updates, diagnoses, safety events and clinical notes.','تحتفظ كل زيارة بنتائج المختبر والتغييرات العلاجية والتشخيصات والأعراض والملاحظات الخاصة بها.')}</p>${visits(p)}</div>`}
function quality(){let flagged=patients.filter(p=>p.visits.some(v=>v.ae&&!v.ae.startsWith('None')));return `<div class="card"><h2>${t('Safety & data quality','السلامة وجودة البيانات')}</h2><div class="alert">${t('Illustrative only: reported adverse events here are fictional and do not constitute a pharmacovigilance system.','للشرح فقط: الأحداث الواردة افتراضية وليست نظام يقظة دوائية.')}</div><h3>${t('Example safety records','بلاغات السلامة الافتراضية')}</h3>${patientTable(flagged.slice(0,40))}</div>`}

can we help?','كيف يمكننا مساعدتك؟')}</h2><div class="support-step"><span class="support-number">01</span><div><strong>${t('New patient enrollment','تسجيل مريض جديد')}</strong><div class="muted small">${t('Create one baseline profile. Confirm eligibility and consent before entering fictional demo data.','أنشئ ملفاً أساسياً واحداً وتأكد من الأهلية والموافقة قبل إدخال البيانات التجريبية.')}</div></div></div><div class="support-step"><span class="support-number">02</span><div><strong>${t('Follow-up visit','زيارة المتابعة')}</strong><div class="muted small">${t('Find an existing patient by name or study ID and record only new results or clinical changes.','ابحث عن المريض بالاسم أو رقم الدراسة وسجل النتائج الجديدة أو التغيرات السريرية فقط.')}</div></div></div><div class="support-step"><span class="support-number">03</span><div><strong>${t('Questions or data correction','الاستفسارات أو تصحيح البيانات')}</strong><div class="muted small">${t('Contact the MSL to discuss study procedures and appropriate correction workflows.','تواصل مع مسؤول الاتصال العلمي الطبي لمناقشة إجراءات الدراسة وتصحيح البيانات.')}</div></div></div><div class="support-warning">${t('Privacy: Do not send patient names, identifiable clinical records, or adverse-event case details through ordinary phone messages or unsecured channels. Report safety concerns using the company-approved pharmacovigilance process.','الخصوصية: يُرجى عدم إرسال أسماء المرضى أو سجلاتهم الطبية التعريفية أو تفاصيل حالات الأحداث الضارة عبر الرسائل العادية أو قنوات غير آمنة. يجب الإبلاغ عن مسائل السلامة عبر آلية اليقظة الدوائية المعتمدة لدى الشركة.')}</div></section></div>`}
function clinic(){let ps=patients.filter(p=>p.clinic===state.clinic),filtered=ps.filter(p=>(p.name+' '+p.arName+' '+p.id).toLowerCase().includes(state.search.toLowerCase()));if(state.view==='contact')return clinicContact();if(state.view==='enroll')return `<div>${clinicNavigation()}${enroll()}</div>`;if(state.view==='visit')return `<div>${clinicNavigation()}${followUp(pById(state.patient))}</div>`;return `<div class="hero"><h1>${clinicLabel(state.clinic)} | ${t('Clinic Staff','موظفو العيادة')}</h1><p>${clinicMeta(state.clinic)}</p><p>${t('Find an existing patient for the next visit or enroll a new patient.','ابحث عن مريض حالي لإكمال الزيارة أو سجل مريضاً جديداً.')}</p></div>${clinicNavigation()}${boxStats(metric(state.clinic))}<div class="card"><h2>${t('Search patients by name','ابحث عن المرضى بالاسم')}</h2><p class="muted small">${t('Only patients enrolled at your clinic are shown. Medical history is entered once.','تظهر فقط أسماء مرضى عيادتك. يدخل التاريخ المرضي مرة واحدة.')}</p><div class="toolbar"><input id="search" value="${esc(state.search)}" placeholder="${t('Type a patient name or ID','اكتب اسم المريض أو رقمه')}"><button data-action="search">${t('Search','بحث')}</button><button data-action="clearSearch">${t('Clear','مسح')}</button></div><div class="scroll"><table><thead><tr><th>${t('Patient','المريض')}</th><th>${t('ID','الرقم')}</th><th>${t('Visits completed','الزيارات المكتملة')}</th><th>${t('Next step','الخطوة التالية')}</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${esc(names(p))}</strong></td><td>${esc(p.id)}</td><td>${p.visits.length}/3</td><td>${p.visits.length===3?`<span class="pill">${t('Complete','مكتمل')}</span>`:b(t('Record '+mon(p.visits.length),'تسجيل '+mon(p.visits.length)),'next:'+p.id,'primary')}</td></tr>`).join('')}</tbody></table></div></div>`}
const comorbidityOptions=[['Hypertension','ارتفاع ضغط الدم'],['Dyslipidemia','اضطراب شحميات الدم'],['Chronic kidney disease','مرض الكلى المزمن'],['Coronary artery disease','مرض الشريان التاجي'],['Heart failure','قصور القلب'],['Obesity','السمنة'],['Hypothyroidism','قصور الغدة الدرقية'],['Atrial fibrillation','الرجفان الأذيني'],['Peripheral arterial disease','مرض الشرايين المحيطية'],['Stroke or TIA','السكتة الدماغية أو النوبة الإقفارية العابرة'],['Chronic liver disease','مرض الكبد المزمن'],['Chronic obstructive pulmonary disease','داء الانسداد الرئوي المزمن'],['Asthma','الربو'],['Other','أخرى']];
function enroll(){return `<div class="noprint">${b(t('← Patient list','← قائمة المرضى'),'clinicHome')}</div><div class="card"><h2>${t('Enroll new patient · Baseline','تسجيل مريض جديد · الزيارة الأساسية')}</h2><p class="alert">${t('Demo only. Enter invented patient names and values; do not enter identifiable health information.','عرض تجريبي فقط. استخدم بيانات افتراضية ولا تدخل معلومات صحية حقيقية.')}</p><form id="enrollForm"><div class="fieldgrid"><label>${t('Full patient name','الاسم الكامل')}<input name="name" required></label><label>${t('Age','العمر')}<input name="age" type="number" min="18" max="100" required></label><label>${t('Sex (male/female)','الجنس (ذكر/أنثى)')}<select name="gender"><option>Male</option><option>Female</option></select></label><label>${t('Years since type 2 diabetes diagnosis','سنوات الإصابة بالسكري')}<input type="number" name="diabetesYears" min="0" required></label><label class="span2">${t('Medical history','التاريخ المرضي')}<textarea name="history" rows="3"></textarea></label><label class="span2">${t('Comorbidities (select all applicable)','الأمراض المصاحبة (اختر جميع الحالات المنطبقة)')}<select name="diagnoses" multiple size="9" aria-label="Comorbidities">${comorbidityOptions.map(([en,ar])=>`<option value="${en}">${t(en,ar)}</option>`).join('')}</select><small class="muted">${t('Use Ctrl/Command to select multiple conditions','استخدم Ctrl أو Command لاختيار أكثر من حالة')}</small></label><label class="span2">${t('Other comorbidities (specify)','أمراض مصاحبة أخرى (يرجى التحديد)')}<input name="otherDiagnoses" placeholder="${t('Optional','اختياري')}"></label><label class="span2">${t('Concomitant medications, doses and frequency (one per line, use | separators)','الأدوية المصاحبة والجرعات والتكرار (كل دواء في سطر وافصل بعلامة |)')}<textarea name="medications" rows="3" placeholder="Metformin | 1000 mg | Twice daily"></textarea></label><label>${t('Visit date','تاريخ الزيارة')}<input name="date" type="date" required></label><label>${t('Glenpa strength','تركيز جلينبا')}<select name="dose"><option>10/5 mg</option><option>25/5 mg</option></select></label><label>HbA1c (%)<input name="hba1c" type="number" step="0.1" min="3" max="20" required></label><label>${t('Fasting glucose (mg/dL)','سكر صائم (ملغم/دل)')}<input name="fpg" type="number" min="40" required></label><label>eGFR (mL/min/1.73m²)<input name="egfr" type="number" min="0"></label><label>${t('Weight (kg)','الوزن (كغم)')}<input name="weight" type="number"></label></div><p><button type="submit" class="primary">${t('Save patient and baseline visit','حفظ المريض والزيارة الأساسية')}</button></p></form></div>`}
function followUp(p){if(!p)return clinic();let v=p.visits.length;if(v>=3)return clinic();return `<div class="noprint">${b(t('← Patient list','← قائمة المرضى'),'clinicHome')}</div><div class="card"><h2>${esc(names(p))} · ${mon(v)}</h2><div class="pill">${esc(p.id)}</div><p class="muted">${t('Existing patient demographics and original history are retained automatically. Enter only new results and changes.','تحتفظ المنصة ببيانات المريض وتاريخه الأساسي. أدخل فقط النتائج والتغيرات الجديدة.')}</p><div class="kv"><div><span>${t('Last visit','آخر زيارة')}</span><b>${fmt(p.visits.at(-1).date)}</b></div><div><span>${t('Previous HbA1c','HbA1c السابق')}</span><b>${fmt(p.visits.at(-1).hba1c)}%</b></div><div><span>${t('Visit being recorded','الزيارة الحالية')}</span><b>${mon(v)}</b></div></div><p><strong>${t('Original comorbidities:','الأمراض المصاحبة الأصلية:')}</strong> ${esc(p.diagnoses.join(', '))}</p><p><strong>${t('Original medications:','الأدوية الأساسية:')}</strong> ${esc(p.medications.map(x=>x.name+' '+x.dose).join(', '))}</p></div><div class="card"><h3>${t('New visit data','بيانات الزيارة الجديدة')}</h3><form id="followForm"><div class="fieldgrid"><label>${t('Visit date (minimum 3 calendar months since previous visit)','تاريخ الزيارة (بعد ٣ أشهر على الأقل)')}<input name="date" type="date" required></label><label>HbA1c (%)<input name="hba1c" type="number" step="0.1" min="3" max="20" required></label><label>${t('Fasting glucose (mg/dL)','سكر صائم')}<input name="fpg" type="number" min="40" required></label><label>eGFR<input name="egfr" type="number" min="0"></label><label>${t('Weight (kg)','الوزن')}<input name="weight" type="number"></label><label>${t('Current Glenpa strength','جرعة جلينبا الحالية')}<select name="dose"><option>10/5 mg</option><option>25/5 mg</option></select></label><label>${t('Adverse events','الأحداث الضارة')}<input name="ae" placeholder="None reported"></label><label class="span2">${t('New, changed or stopped medication','أدوية جديدة أو معدلة أو موقوفة')}<textarea name="change" rows="2"></textarea></label><label class="span2">${t('New diagnoses / comorbidities','تشخيصات أو أمراض مصاحبة جديدة')}<textarea name="diagnosis" rows="2"></textarea></label><label class="span2">${t('Visit notes','ملاحظات الزيارة')}<textarea name="notes" rows="2"></textarea></label></div><p><button type="submit" class="primary">${t('Save this visit','حفظ الزيارة')}</button></p><div id="formError" class="alert" style="display:none"></div></form></div>`}
function render(){document.documentElement.lang=state.language;document.documentElement.dir=state.language==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=state.language==='ar'?'English':'العربية';document.getElementById('logout').style.display=state.role?'':'none';document.getElementById('strap').textContent=t('Dar Aldawa · Fictional demonstration data only','دار الدواء · بيانات تجريبية افتراضية فقط');document.getElementById('app').innerHTML=!state.role?login():state.role==='admin'?admin():clinic();}
function downloadCSV(){let rows=[['Clinic','Patient ID','Name (fictional)','Age','Sex','Visit','Date','HbA1c','FPG','eGFR','Dose','Adverse event','Medication change']];patients.forEach(p=>p.visits.forEach(v=>rows.push([p.clinic,p.id,p.name,p.age,p.gender,v.number,v.date,v.hba1c,v.fpg,v.egfr,v.dose,v.ae,v.change])));let csv=rows.map(r=>r.map(a=>'"'+String(a??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Glenpa_26_Clinics_Patient_Visits.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let val=el.dataset.action;if(val==='loginAdmin'){if(document.getElementById('adminuser').value==='msl.admin'&&document.getElementById('adminpass').value==='Admin2026!'){state.role='admin';state.view='overview'}else alert('Invalid demo credentials')}else if(val==='loginClinic'){let u=document.getElementById('clinicuser').value.trim().toLowerCase();let match=/^clinic(0[1-9]|1[0-9]|2[0-6])$/.exec(u);if(match&&document.getElementById('clinicpass').value==='Glenpa'+match[1]+'!'){state.role='clinic';state.clinic=Number(match[1]);state.view='home';state.search=''}else alert(t('Invalid clinic username or password','اسم مستخدم العيادة أو كلمة المرور غير صحيحة'))}else if(val.startsWith('nav:')){state.view=val.split(':')[1];state.patient=null;state.search=''}else if(val.startsWith('clinic:')){state.selectedClinic=+val.split(':')[1];state.view='clinicDetail';state.patient=null;state.clinicSearch=''}else if(val.startsWith('patient:'))state.patient=val.slice(8);else if(val.startsWith('next:')){state.patient=val.slice(5);state.view='visit'}else if(val==='contact')state.view='contact';else if(val==='enroll')state.view='enroll';else if(val==='clinicHome'){state.view='home';state.patient=null}else if(val==='search'){state.search=document.getElementById('search')?.value||'';state.visitFilter=document.getElementById('visitFilter')?.value||'all';}else if(val==='clinicSearch')state.clinicSearch=document.getElementById('clinicSearch')?.value||'';else if(val==='clearSearch'){state.search='';state.visitFilter='all';}else if(val==='exportCSV')downloadCSV();else if(val==='print')window.print();render()});document.getElementById('logout').onclick=()=>{state.role='';state.patient=null;state.view='overview';render()};document.getElementById('lang').onclick=()=>{state.language=state.language==='en'?'ar':'en';render()};document.getElementById('theme').onchange=e=>setTheme(e.target.value);document.addEventListener('change',e=>{if(e.target.id==='sortClinics'){state.sortClinics=e.target.value;render()}});document.addEventListener('submit',e=>{if(!['enrollForm','followForm'].includes(e.target.id))return;e.preventDefault();let f=new FormData(e.target),get=k=>(f.get(k)||'').toString().trim();if(e.target.id==='enrollForm'){let list=patients.filter(p=>p.clinic===state.clinic),id=`C${pad(state.clinic)}-P${pad(list.length+1)}`,name=get('name');let p={id,clinic:state.clinic,name,arName:name,age:+get('age'),gender:get('gender'),diabetesYears:+get('diabetesYears'),history:get('history'),diagnoses:[...e.target.querySelector('[name=diagnoses]').selectedOptions].map(x=>x.value).filter(x=>x!=='Other').concat(get('otherDiagnoses').split(',').map(x=>x.trim()).filter(Boolean)),medications:get('medications').split('\n').filter(Boolean).map(s=>{let [name,dose,frequency]=s.split('|').map(x=>x?.trim()||'');return{name,dose,frequency,status:'Ongoing'}}),visits:[{number:1,date:get('date'),hba1c:+get('hba1c'),fpg:+get('fpg'),egfr:get('egfr'),weight:get('weight'),dose:get('dose'),adherence:'Not applicable',ae:'None reported',change:'Baseline medication reconciliation',diagnosis:'None reported',notes:'New enrollment'}]};patients.push(p);persist();state.view='home';state.search=name;render();alert(t('New fictional patient saved.','تم حفظ المريض الافتراضي الجديد.'))}else{let p=pById(state.patient);if(!p||p.visits.length>=3)return;let prior=p.visits.at(-1).date,earliest=new Date(prior+'T12:00:00Z');earliest.setUTCMonth(earliest.getUTCMonth()+3);let min=earliest.toISOString().slice(0,10);if(get('date')<min){let err=document.getElementById('formError');err.style.display='block';err.textContent=t('Visit must be at least three calendar months after the preceding visit. Earliest: ','يجب مرور ثلاثة أشهر على الأقل من الزيارة السابقة. أقرب تاريخ: ')+min;return}p.visits.push({number:p.visits.length+1,date:get('date'),hba1c:+get('hba1c'),fpg:+get('fpg'),egfr:get('egfr'),weight:get('weight'),dose:get('dose'),ae:get('ae')||'None reported',change:get('change')||'No changes reported',diagnosis:get('diagnosis')||'None reported',notes:get('notes')});persist();state.view='home';state.patient=null;render();alert(t('Follow-up visit saved.','تم حفظ زيارة المتابعة.'))}});
// Enhanced interactive navigation and clinical overview extensions.
let quickFindOpen=false;let presentationMode=false;
const originalAdmin=admin;
admin=function(){let html=originalAdmin();const navButtons=`<div class="premium-floating-actions noprint"><button data-action="quickFind">⌕ ${t('Quick patient search','بحث سريع عن مريض')}</button><button data-action="presentation">▣ ${presentationMode?t('Exit presentation','إنهاء العرض'):t('Presentation mode','وضع العرض')}</button><button data-action="print">⎙ ${t('Print report','طباعة التقرير')}</button></div>`;
html=html.replace('<div class="top-actions">','<div class="top-actions">'+navButtons);
if(!state.patient&&state.view==='overview'){
const summary=changeSummary(patients);let completed=patients.filter(x=>x.visits.length===3).length;let safety=patients.flatMap(x=>x.visits).filter(x=>x.ae&&x.ae!=='None reported').length;
const hero=`<div class="premium-hero-banner"><div class="hero-tag">${t('GLENPA REAL 3.0 · MEDICAL AFFAIRS INTELLIGENCE','جلينبا REAL ٣٫٠ · ذكاء الشؤون الطبية')}</div><h2>${t('See the full clinical picture.','رؤية شاملة للمسار السريري.')}</h2><p>${t('From 26 participating doctors to each recorded visit. New study register starts empty.','من ٢٦ طبيباً مشاركاً إلى كل زيارة مسجلة. يبدأ سجل الدراسة فارغاً.')}</p><div class="meta"><span>26 ${t('clinics','عيادة')}</span><span>${patients.length} ${t('patient profiles','ملف مريض')}</span><span>${completed} ${t('completed Month 6','أكملوا زيارة الشهر السادس')}</span><span>${summary.n} ${t('paired HbA1c records','سجل HbA1c مزدوج')}</span><span>${safety} ${t('AE entries','سجلات أحداث ضارة')}</span></div></div>`;
html=html.replace('<div class="content-area">','<div class="content-area">'+hero);
}
if(quickFindOpen){let q=(state.quickSearch||'').toLowerCase();let matches=q.length>=2?patients.filter(p=>(p.name+' '+p.arName+' '+p.id).toLowerCase().includes(q)).slice(0,14):[];const panel=`<section class="card" id="quickPanel"><div class="row"><h2>${t('Find a patient across all clinics','البحث عن مريض في جميع العيادات')}</h2><button data-action="quickClose">✕</button></div><input class="command-input" id="quickInput" placeholder="${t('Type patient name or study ID, then Search','اكتب اسم المريض أو رقم الدراسة ثم اضغط بحث')}" value="${esc(state.quickSearch||'')}"><div class="toolbar"><button class="primary" data-action="quickSearch">${t('Search','بحث')}</button><small class="muted">${t('Fictional names only · matches shown below','أسماء افتراضية فقط · تظهر نتائج البحث أدناه')}</small></div><div class="quickfind-results">${matches.map(p=>`<button data-action="patient:${esc(p.id)}"><strong>${esc(names(p))}</strong><small>${esc(p.id)} · ${clinicLabel(p.clinic)} · ${p.visits.length}/3 ${t('visits','زيارات')}</small></button>`).join('')||`<p class="muted">${t('Enter at least two characters.','أدخل حرفين على الأقل.')}</p>`}</div></section>`;html=html.replace('<div class="content-area">','<div class="content-area">'+panel)}
return html;
};
document.addEventListener('click',e=>{let button=e.target.closest('[data-action]');if(!button)return;let a=button.dataset.action;if(['quickFind','quickClose','quickSearch','presentation'].includes(a)){e.stopImmediatePropagation()}if(a==='quickFind'){quickFindOpen=true;render();document.getElementById('quickInput')?.focus()}else if(a==='quickClose'){quickFindOpen=false;render()}else if(a==='quickSearch'){state.quickSearch=document.getElementById('quickInput')?.value||'';quickFindOpen=true;render();document.getElementById('quickInput')?.focus()}else if(a==='presentation'){presentationMode=!presentationMode;document.body.classList.toggle('presentation-mode',presentationMode);render()}else if(a.startsWith('patient:')){quickFindOpen=false}} ,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&quickFindOpen){quickFindOpen=false;render()}if((e.ctrlKey||e.metaKey)&&e.key==='k'&&state.role==='admin'){e.preventDefault();quickFindOpen=true;render();document.getElementById('quickInput')?.focus()}if(e.key==='Enter'&&e.target.id==='quickInput'){e.preventDefault();state.quickSearch=e.target.value;render();document.getElementById('quickInput')?.focus()}});

let savedTheme='blue';try{savedTheme=localStorage.getItem('glenpa-theme-preference')||'blue'}catch(e){}setTheme(savedTheme);render();
</script></body></html>
